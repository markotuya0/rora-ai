version: '3.8'

services:
  api:
    build: .
    container_name: rora-ai-api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LLM_MODEL=qwen2.5:0.5b
    volumes:
      - ./student_grades.db:/app/student_grades.db
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  streamlit:
    build: .
    container_name: rora-ai-ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./student_grades.db:/app/student_grades.db
    command: streamlit run app_v2.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: rora-ai-network
