version: '3.8'

services:
  api:
    build: .
    container_name: rora-ai-api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LLM_MODEL=llama3.2:3b
      - DB_URI=postgresql://rora:rora@db:5432/rora
      - ALLOWED_ORIGINS=http://localhost:3000
    command: >
      sh -c "alembic upgrade head &&
             uvicorn api:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: rora-ai-db
    environment:
      - POSTGRES_USER=rora
      - POSTGRES_PASSWORD=rora
      - POSTGRES_DB=rora
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rora -d rora"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: rora-ai-web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  streamlit:
    build: .
    container_name: rora-ai-ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    command: streamlit run app_v2.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

networks:
  default:
    name: rora-ai-network
